AWSTemplateFormatVersion: '2010-09-09'
Description: Northstar durable state and fixture artifact primitives.

Parameters:
  EnvironmentName:
    Type: String
  DeploymentContractVersion:
    Type: String

Resources:
  ScenarioStateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub northstar-${EnvironmentName}-scenario-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scenario_run_id
          AttributeType: S
        - AttributeName: record_key
          AttributeType: S
      KeySchema:
        - AttributeName: scenario_run_id
          KeyType: HASH
        - AttributeName: record_key
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: northstar:environment
          Value: !Ref EnvironmentName

  FixtureBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: northstar:environment
          Value: !Ref EnvironmentName

  PromptSelectionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub northstar-${EnvironmentName}-prompt-selections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PromptKey
          AttributeType: S
      KeySchema:
        - AttributeName: PromptKey
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: northstar:environment
          Value: !Ref EnvironmentName
        - Key: northstar:purpose
          Value: prompt-management

Outputs:
  EnvironmentName:
    Description: Environment propagated to dependent stacks.
    Value: {Ref: EnvironmentName}
  DeploymentContractVersion:
    Description: Deployment contract version propagated to dependent stacks.
    Value: {Ref: DeploymentContractVersion}
  ScenarioStateTableName:
    Description: DynamoDB table for run-scoped simulator records and events.
    Value: !Ref ScenarioStateTable
  FixtureBucketName:
    Description: S3 bucket for immutable scenario fixtures and artifacts.
    Value: !Ref FixtureBucket
  PromptSelectionsTableName:
    Description: DynamoDB table containing admin-selected active Bedrock prompt versions.
    Value: !Ref PromptSelectionsTable
