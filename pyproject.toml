[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-agentcore-harness"
version = "0.1.0"
description = "A synthetic IT operations demonstration using Amazon Bedrock AgentCore Harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.44.9",
    "fastapi==0.165.0",
    "mangum==0.22.0",
    "PyJWT[crypto]==2.15.1",
    "PyYAML==6.0.4",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["apps*", "evaluation*", "harness*", "simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
